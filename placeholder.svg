<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a7bd5" stop-opacity="0.06" />
      <stop offset="50%" stop-color="#9b2fc8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#e91e8c" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a7bd5" />
      <stop offset="100%" stop-color="#9b2fc8" />
    </linearGradient>
  </defs>
  
  <rect width="600" height="400" fill="url(#bg-grad)" rx="24" />
  <rect x="1" y="1" width="598" height="398" stroke="rgba(155, 47, 200, 0.15)" stroke-width="2" rx="23" />
  
  <!-- Outer glowing rings -->
  <circle cx="300" cy="180" r="90" stroke="rgba(58, 123, 213, 0.08)" stroke-width="1.5" stroke-dasharray="8 4" />
  <circle cx="300" cy="180" r="75" stroke="rgba(155, 47, 200, 0.06)" stroke-width="1.5" />
  
  <!-- Diagnostic Box Symbol -->
  <g transform="translate(300, 180)">
    <!-- Main Device/Kit box -->
    <rect x="-50" y="-35" width="100" height="70" rx="12" fill="white" stroke="url(#accent-grad)" stroke-width="3" />
    
    <!-- Test Strip slot -->
    <rect x="-35" y="-12" width="70" height="24" rx="4" fill="#fafafa" stroke="#e5e7eb" stroke-width="1.5" />
    
    <!-- Result window details -->
    <circle cx="-20" cy="0" r="5" fill="#edf2f7" />
    <line x1="2" y1="-6" x2="2" y2="6" stroke="#e91e8c" stroke-width="2" stroke-linecap="round" />
    <line x1="14" y1="-6" x2="14" y2="6" stroke="#3a7bd5" stroke-width="2" stroke-linecap="round" />
    <text x="2" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6" font-weight="bold" fill="#a0aec0" text-anchor="middle">T</text>
    <text x="14" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6" font-weight="bold" fill="#a0aec0" text-anchor="middle">C</text>
  </g>
  
  <!-- Text Elements -->
  <text x="300" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="-0.5">DX BIOCODE DIAGNOSTICS</text>
  <text x="300" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#6b7280" text-anchor="middle">Diagnostic Product Consumable</text>
  <text x="300" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#3a7bd5" text-anchor="middle" letter-spacing="0.5">CE &amp; EU-IVD CERTIFIED</text>
</svg>
